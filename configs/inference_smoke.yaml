# Short end-to-end test. It uses the same model and FadeMem parameters as
# inference.yaml, but generates only 30 latent frames.
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true
num_frame_per_block: 3
model_name: Wan2.1-T2V-1.3B

model_kwargs:
  local_attn_size: 3
  timestep_shift: 5.0
  sink_size: 0
  fademem_enabled: true
  fademem_summary_slots: 12
  fademem_warp_type: power
  fademem_warp_beta: 0.3
  fademem_span_gamma: 0.5

data_path: prompts/example.txt
output_folder: outputs/smoke
inference_iter: -1
num_output_frames: 30
vae_stream_chunk_size: 30
use_ema: false
seed: 42
num_samples: 1
save_with_index: true
context_noise: 0
low_memory: auto

generator_ckpt: longlive_models/models/longlive_base.pt
lora_ckpt: longlive_models/models/lora.pt

adapter:
  type: lora
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: bfloat16
  verbose: false
