# FadeMem streaming long-video training initialized from LongLive step 3000.
generator_ckpt: longlive_models/models/longlive_base.pt
lora_ckpt: longlive_models/models/lora.pt
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
real_name: Wan2.1-T2V-14B
fake_name: Wan2.1-T2V-1.3B
text_encoder_fsdp_wrap_strategy: size

denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true
ts_schedule: false
num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 3.0
denoising_loss_type: flow
mixed_precision: true
seed: 42

# Fill these only when W&B logging is enabled. Authentication uses WANDB_API_KEY.
wandb_entity: ""
wandb_project: ""

sharding_strategy: hybrid_full
lr: 5.0e-07
lr_critic: 2.0e-07
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
data_path: prompts/vidprom_filtered_extended.txt
switch_prompt_path: prompts/vidprom_filtered_extended_switch.txt
batch_size: 1
gradient_accumulation_steps: 1
ema_weight: 0.99
ema_start_step: 200
log_iters: 200
max_checkpoints: 5
max_iters: 4000  # Global-step target; the LongLive base starts at step 3000, so checkpoint_model_004000 contains 1,000 additional FadeMem LoRA steps.

negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
dfake_gen_update_ratio: 5
image_or_video_shape:
- 1
- 240
- 16
- 60
- 104
distribution_loss: dmd_switch
trainer: score_distillation
gradient_checkpointing: true
num_frame_per_block: 3
load_raw_video: false
global_sink: false

model_kwargs:
  model_name: Wan2.1-T2V-1.3B
  timestep_shift: 5.0
  local_attn_size: 3
  sink_size: 0
  fademem_enabled: true
  fademem_summary_slots: 12
  fademem_warp_type: power
  fademem_warp_beta: 0.3
  fademem_span_gamma: 0.5

vis_interval: 500
vis_ema: false
vis_video_lengths:
- 240
val_batch_size: 1
val_data_path: prompts/vidprom_filtered_extended.txt
val_switch_prompt_path: prompts/vidprom_filtered_extended_switch.txt

slice_last_frames: 21
streaming_training: true
streaming_chunk_size: 21
streaming_max_length: 240
streaming_min_new_frame: 18
train_first_chunk: true
last_step_only: false

switch_mode: random_choice
switch_choices:
- 21
- 39
- 57
- 75
- 93
- 111
- 129
- 147
- 165
- 183
- 201

adapter:
  type: lora
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: bfloat16
  apply_to_critic: true
  verbose: false
